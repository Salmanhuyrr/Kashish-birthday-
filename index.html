<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Kashish ❤️</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Floating hearts -->
<div id="hearts"></div>
<div id="sparkles"></div>


<!-- =====================================================
     1. COVER
===================================================== -->

<section class="page cover" id="home">

    <div class="cover-decor decor-star s1">★</div>
    <div class="cover-decor decor-star s2">★</div>
    <div class="cover-decor decor-star s3">★</div>

    <div class="cover-content">

        <p class="eyebrow">A little surprise for</p>

        <h1>Kashish</h1>

        <div class="script">
            Happy Birthday
        </div>

        <!-- MAIN PHOTO -->
        <div class="main-photo">
            <img
                src="./Assets/Kashish.jpg"
                alt="Kashish"
            >
        </div>

        <p class="small-script">
            made with love, just for you ♡
        </p>

        <button
            class="primary-btn"
            onclick="goTo('gifts')">
            OPEN YOUR SURPRISE
        </button>

    </div>

</section>



<!-- =====================================================
     2. THREE GIFTS
===================================================== -->

<section class="page gifts-page" id="gifts">

    <p class="eyebrow">
        For you, always
    </p>

    <h2>
        Three Little Gifts
    </h2>

    <div class="gold-line"></div>


    <div class="gift-grid">


        <!-- LETTER -->

        <button
            class="gift-card"
            onclick="openLetter()">

            <div class="gift-icon">
                💌
            </div>

            <h3>
                A Letter
            </h3>

            <p>
                Words from the heart
            </p>

        </button>



        <!-- ROSES -->

        <button
            class="gift-card"
            onclick="openRoses()">

            <div class="gift-icon">
                💐
            </div>

            <h3>
                Fresh Roses
            </h3>

            <p>
                A bouquet, just for you
            </p>

        </button>



        <!-- SURPRISE -->

        <button
            class="gift-card"
            onclick="openSurprise()">

            <div class="gift-icon">
                🎁
            </div>

            <h3>
                A Surprise
            </h3>

            <p>
                Tied with a gold ribbon
            </p>

        </button>

    </div>


    <button
        class="secondary-btn"
        onclick="goTo('accept')">

        CONTINUE

    </button>

</section>



<!-- =====================================================
     3. LETTER
===================================================== -->

<section
    class="page letter-page"
    id="letter">

    <div class="modal-card">

        <button
            class="close"
            onclick="closeOverlay()">
            ×
        </button>


        <div class="heart-icon">
            ❤️
        </div>

        <h2>
            A Letter
        </h2>

        <p class="script subtitle">
            Words from the heart
        </p>


        <div class="letter-text">

            <p>
                Happy Birthday kashish bby❤️
            </p>

            <p>
                You make my life so much more beautiful
                just by being in it.
            </p>

            <p>
                I'm so lucky to have you. 🥹💕
            </p>
